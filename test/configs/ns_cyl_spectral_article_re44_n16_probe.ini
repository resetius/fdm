# Protected native ARPACK screen for the small article example.
# Run from the repository root:
# ./build/test/fdm_ns_cyl_spectral_probe \
#     -c test/configs/ns_cyl_spectral_article_re44_n16_probe.ini
# Apple M5 Pro: 1.05 s for all 81 probes and three dense blocks.  This is
# deliberately redundant with the dense reference so the example demonstrates
# both the screening path and an exact independent cross-check.

[ns]
r = 1.5707963267948966
R = 3.141592653589793
h1 = 0.0
h2 = 10.0
u0 = 1.0
Re = 44.0
dt = 0.001
nr = 16
nphi = 16
nz = 16
verbose = 0

[solver]
datatype = double

[spectral]
strategy = blocks
backend = native
operator_steps = 50
growth_tol = 1e-8
residual_tol = 1e-10
condition_limit = 1e10

m_min = 0
m_max = 8
l_min = 0
l_max = 8
include_zero = 1

arpack_screen = 1
nev = 8
max_nev = 32
ncv = 64
tol = 1e-10
maxit = 10000
probe_starts = 3
probe_lr_starts = 3
stable_guard = 8
dense_all = 0
dense_candidates = 1

# Never let a false-negative probe suppress dense verification of the
# transition band around the known unstable block (0,3).
force_dense_m_min = 0
force_dense_m_max = 0
force_dense_l_min = 2
force_dense_l_max = 4

threads = 8
residual_seed = 0
output = build/ns_lapl_experiments/article_re44_n16_native_probe_dense_s50_spectrum.nc
