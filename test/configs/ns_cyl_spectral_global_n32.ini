# Run from the repository root:
# ./build/test/fdm_ns_cyl_spectral_probe -c test/configs/ns_cyl_spectral_global_n32.ini
# Apple M5 Pro: 368.365 s in ARPACK, 5275 matvecs, 24/24 reference blocks.
# One screening pass; use the block dense path to build the final projector.

[ns]
r = 1.5707963267948966
R = 3.141592653589793
h1 = 0.0
h2 = 10.0
u0 = 1.0
Re = 100.0
dt = 0.001
nr = 32
nphi = 32
nz = 32
verbose = 0

[solver]
datatype = float

[spectral]
strategy = global
backend = sycl
operator_steps = 100
growth_tol = 1e-5
residual_tol = 1e-5
condition_limit = 1e6
maxit = 10000
tol = 1e-5
residual_seed = 0

global_nev = 96
global_max_nev = 96
global_ncv = 128
global_starts = 1
global_stable_guard = 4
global_block_energy_tol = 1e-2
global_top_blocks = 4
