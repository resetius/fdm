# Run from the repository root:
# ./build/test/fdm_ns_cyl_spectral_probe \
#     -c test/configs/ns_cyl_spectral_native_float_n32.ini
# Apple M5 Pro: 3.45 s for the complete dense scan, 24 unstable blocks,
# 48 eigenvalue groups and 74 real phase coordinates.

[ns]
r = 1.5707963267948966
R = 3.141592653589793
h1 = 0.0
h2 = 10.0
u0 = 1.0
Re = 100.0
dt = 0.001
nr = 32
nphi = 32
nz = 32
verbose = 0

[solver]
datatype = float

[spectral]
strategy = blocks
backend = native
operator_steps = 50
growth_tol = 1e-5
residual_tol = 1e-5
condition_limit = 1e6

m_min = 0
m_max = 16
l_min = 0
l_max = 16
include_zero = 1

arpack_screen = 0
dense_all = 1
dense_candidates = 0

threads = 0
residual_seed = 0
output = build/ns_lapl_experiments/re100_n32_native_float_dense_s50_spectrum.nc
