# Complete native dense reference for the small article example.
# Run from the repository root:
# ./build/test/fdm_ns_cyl_spectral_probe \
#     -c test/configs/ns_cyl_spectral_article_re44_n16_dense.ini
# Apple M5 Pro: 0.37 s for all 81 blocks.  The only unstable block is
# (m,l)=(0,3), with two real axial phase coordinates.

[ns]
r = 1.5707963267948966
R = 3.141592653589793
h1 = 0.0
h2 = 10.0
u0 = 1.0
Re = 44.0
dt = 0.001
nr = 16
nphi = 16
nz = 16
verbose = 0

[solver]
datatype = double

[spectral]
strategy = blocks
backend = native
operator_steps = 50
growth_tol = 1e-8
residual_tol = 1e-10
condition_limit = 1e10

m_min = 0
m_max = 8
l_min = 0
l_max = 8
include_zero = 1

arpack_screen = 0
dense_all = 1
dense_candidates = 0

threads = 8
residual_seed = 0
output = build/ns_lapl_experiments/article_re44_n16_native_dense_s50_spectrum.nc
